<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas Misturadas • Carregamento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        bordercol: '#1f2937',
                        brandgreen: '#10b981'
                    }
                }
            }
        }
    </script>
    <!-- SheetJS (XLSX) para exportação -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome Pro/Solid -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 dark:bg-slate-950 text-gray-800 dark:text-gray-100 font-sans leading-normal tracking-normal transition-colors duration-200">

    <!-- Container Principal -->
    <div class="w-full px-3 sm:px-6 py-6 space-y-6 max-w-7xl mx-auto">

        <!-- Header e Status -->
        <div class="flex items-center justify-between border-b border-gray-200 dark:border-slate-800 pb-4">
            <div class="flex items-center space-x-3">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                <div>
                    <span class="text-lg sm:text-xl font-bold tracking-wide">Caixas Misturadas - Carregamento</span>
                    <span class="text-xs text-emerald-400 block font-mono font-semibold">Controle de Exceções</span>
                </div>
            </div>
            <div>
                <span id="status-supabase" class="text-xs bg-slate-800 px-2.5 py-1 rounded-full flex items-center gap-1.5 text-amber-400">
                    <i class="fa-solid fa-circle text-[8px] animate-pulse"></i> Conectando BD...
                </span>
            </div>
        </div>

        <!-- CARDS DE QUANTITATIVOS COM ÍCONE DE CAIXA -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 border-l-4 border-emerald-500 border border-gray-200 dark:border-slate-800 flex justify-between items-center">
                <div>
                    <p class="text-gray-500 dark:text-gray-400 text-xs font-semibold">Total de Caixas Misturadas (Geral)</p>
                    <h3 class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1" id="kpi-geral">0</h3>
                </div>
                <div class="bg-emerald-100 dark:bg-emerald-950/50 p-3 rounded-full text-emerald-600 dark:text-emerald-400">
                    <i class="fa-solid fa-box-open text-lg"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 border-l-4 border-emerald-500 border border-gray-200 dark:border-slate-800 flex justify-between items-center">
                <div>
                    <p class="text-gray-500 dark:text-gray-400 text-xs font-semibold">Total de Caixas Misturadas (Hoje)</p>
                    <h3 class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1" id="kpi-hoje">0</h3>
                </div>
                <div class="bg-emerald-100 dark:bg-emerald-950/50 p-3 rounded-full text-emerald-600 dark:text-emerald-400">
                    <i class="fa-solid fa-boxes-stacked text-lg"></i>
                </div>
            </div>
        </div>

        <!-- TELA DE REGISTRO (FORMULÁRIO) -->
        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-5 border border-gray-200 dark:border-slate-800">
            <h3 class="text-sm font-bold text-gray-800 dark:text-gray-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-box text-emerald-500"></i> Registrar Caixa Misturada
            </h3>
            
            <form id="form-registro" onsubmit="registrarCaixa(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
                
                <!-- SSCC da Caixa -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">SSCC da Caixa *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-barcode text-xs"></i>
                        </span>
                        <input type="text" id="input-sscc" required placeholder="Ex: 1789..." class="w-full pl-9 border border-gray-300 dark:border-slate-700 rounded-lg p-2 text-sm bg-gray-50 dark:bg-slate-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- Portão (7 ao 26) -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">Portão de Origem *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-door-open text-xs"></i>
                        </span>
                        <select id="select-portao" required class="w-full pl-9 border border-gray-300 dark:border-slate-700 rounded-lg p-2 text-sm bg-gray-50 dark:bg-slate-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:border-emerald-500">
                            <option value="" disabled selected>Selecione o Portão</option>
                        </select>
                    </div>
                </div>

                <!-- Ordem (Opcional) -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">Ordem (Opcional)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-file-lines text-xs"></i>
                        </span>
                        <input type="text" id="input-ordem" placeholder="Nº da Ordem" class="w-full pl-9 border border-gray-300 dark:border-slate-700 rounded-lg p-2 text-sm bg-gray-50 dark:bg-slate-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- Número do Pallet -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">Número do Pallet *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-pallet text-xs"></i>
                        </span>
                        <input type="text" id="input-pallet" required placeholder="Nº do Pallet" class="w-full pl-9 border border-gray-300 dark:border-slate-700 rounded-lg p-2 text-sm bg-gray-50 dark:bg-slate-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- Botão Salvar -->
                <div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-lg text-sm shadow transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-circle-check"></i> Salvar Registro
                    </button>
                </div>

            </form>
        </div>

        <!-- PLANILHA DE REGISTROS -->
        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-5 border border-gray-200 dark:border-slate-800 space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-2">
                <h3 class="text-sm font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-boxes-packing text-emerald-500"></i> Histórico de Caixas Misturadas
                </h3>
                <button onclick="exportarExcel()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-excel"></i> Exportar Excel
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-gray-300 border-b border-gray-200 dark:border-slate-700">
                            <th class="p-3"><i class="fa-regular fa-clock mr-1 text-emerald-500"></i> Data / Hora</th>
                            <th class="p-3"><i class="fa-solid fa-barcode mr-1 text-emerald-500"></i> SSCC</th>
                            <th class="p-3"><i class="fa-solid fa-door-open mr-1 text-emerald-500"></i> Portão</th>
                            <th class="p-3"><i class="fa-solid fa-file-lines mr-1 text-emerald-500"></i> Ordem</th>
                            <th class="p-3"><i class="fa-solid fa-pallet mr-1 text-emerald-500"></i> Pallet</th>
                            <th class="p-3 text-center"><i class="fa-solid fa-gear mr-1 text-emerald-500"></i> Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-registros" class="divide-y divide-gray-200 dark:divide-slate-800 text-gray-700 dark:text-gray-200">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-gray-400">Carregando dados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE LÓGICA E CONEXÃO SUPABASE -->
    <script>
        // Utilizando as credenciais corretas do projeto de caixas misturadas
        const SUPABASE_URL = 'https://mdrhviciouopctcbpotr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zs7XKc999RsKCgqRFBPigQ__aYnbqGq';

        let supabaseClient = null;
        let listaRegistros = [];

        try {
            if (SUPABASE_URL && SUPABASE_ANON_KEY) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Erro ao instanciar o Supabase:", e);
        }

        const selectPortao = document.getElementById('select-portao');
        for (let i = 7; i <= 26; i++) {
            const opt = document.createElement('option');
            opt.value = `Portão ${i}`;
            opt.textContent = `Portão ${i}`;
            selectPortao.appendChild(opt);
        }

        async function carregarDados() {
            const statusEl = document.getElementById('status-supabase');
            if (!supabaseClient) {
                statusEl.className = "text-xs bg-slate-800 px-2.5 py-1 rounded-full flex items-center gap-1.5 text-red-400";
                statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> Erro Conexão BD`;
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('caixas_misturadas')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                listaRegistros = data || [];
                atualizarInterface();

                statusEl.className = "text-xs bg-slate-800 px-2.5 py-1 rounded-full flex items-center gap-1.5 text-green-400";
                statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> Sincronizado`;
            } catch (err) {
                console.error("Erro ao carregar dados:", err);
                statusEl.className = "text-xs bg-slate-800 px-2.5 py-1 rounded-full flex items-center gap-1.5 text-red-400";
                statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> Erro BD`;
            }
        }

        async function registrarCaixa(event) {
            event.preventDefault();
            if (!supabaseClient) return;

            const sscc = document.getElementById('input-sscc').value.trim();
            const portao = document.getElementById('select-portao').value;
            const ordem = document.getElementById('input-ordem').value.trim() || '-';
            const pallet = document.getElementById('input-pallet').value.trim();

            const novoRegistro = {
                sscc: sscc,
                portao: portao,
                ordem: ordem,
                pallet: pallet,
                created_at: new Date().toISOString()
            };

            const { error } = await supabaseClient
                .from('caixas_misturadas')
                .insert([novoRegistro]);

            if (error) {
                alert("Erro ao salvar registro: " + error.message);
                return;
            }

            document.getElementById('form-registro').reset();
            carregarDados();
        }

        async function excluirRegistro(id) {
            if (!confirm("Deseja realmente excluir este registro?")) return;

            const { error } = await supabaseClient
                .from('caixas_misturadas')
                .delete()
                .eq('id', id);

            if (error) {
                alert("Erro ao excluir: " + error.message);
                return;
            }

            carregarDados();
        }

        function atualizarInterface() {
            const hojeStr = new Date().toISOString().split('T')[0];

            let totalGeral = listaRegistros.length;
            let totalHoje = listaRegistros.filter(item => {
                const dataItem = String(item.created_at || '');
                return dataItem.includes(hojeStr);
            }).length;

            document.getElementById('kpi-geral').innerText = totalGeral;
            document.getElementById('kpi-hoje').innerText = totalHoje;

            const tbody = document.getElementById('tabela-registros');
            if (listaRegistros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = listaRegistros.map(r => {
                const dataFmt = r.created_at ? new Date(r.created_at).toLocaleString('pt-BR') : '-';
                return `
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-800/50">
                        <td class="p-3 font-mono">${dataFmt}</td>
                        <td class="p-3 font-mono font-bold">${r.sscc}</td>
                        <td class="p-3">${r.portao}</td>
                        <td class="p-3">${r.ordem}</td>
                        <td class="p-3">${r.pallet}</td>
                        <td class="p-3 text-center">
                            <button onclick="excluirRegistro('${r.id}')" class="text-red-500 hover:text-red-700 transition" title="Excluir">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function exportarExcel() {
            if (listaRegistros.length === 0) { alert("Sem dados para exportar."); return; }
            const dadosExport = listaRegistros.map(r => ({
                "Data/Hora": r.created_at ? new Date(r.created_at).toLocaleString('pt-BR') : '',
                "SSCC": r.sscc,
                "Portão": r.portao,
                "Ordem": r.ordem,
                "Pallet": r.pallet
            }));
            const worksheet = XLSX.utils.json_to_sheet(dadosExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "CaixasMisturadas");
            XLSX.writeFile(workbook, "Caixas_Misturadas_Carregamento.xlsx");
        }

        window.onload = function() {
            carregarDados();
        };
    </script>
</body>
</html>
